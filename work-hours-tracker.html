<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Hours">
<title>Work Hours Tracker</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #ededea;
    --text: #1a1a18; --text2: #6b6b67; --text3: #a0a09c;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --radius: 12px; --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2c;
      --text: #f0f0ec; --text2: #a0a09c; --text3: #686864;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }

  .header { padding: 18px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 22px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .live-clock { font-size: 14px; font-weight: 500; color: var(--text2); letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; border-bottom: 0.5px solid var(--border); margin: 14px 0 0; padding: 0 8px; }
  .tab { flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 500; text-align: center; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab svg { width: 18px; height: 18px; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 90px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

  .field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  input[type="date"], input[type="text"], input[type="number"] {
    width: 100%; padding: 12px 14px; font-size: 15px; font-family: var(--font);
    background: var(--bg2); color: var(--text); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); outline: none; -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--border2); background: var(--bg); }
  .field-mb { margin-bottom: 12px; }

  .hours-wrap { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; margin-bottom: 12px; }
  .hours-wrap input { background: none; border: none; font-size: 36px; font-weight: 600; color: var(--text); width: 100%; padding: 0; outline: none; -webkit-appearance: none; appearance: none; }
  .hours-wrap input:focus { background: none; border: none; }
  .hours-unit { font-size: 16px; color: var(--text2); font-weight: 500; }

  .quick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .quick-btn { padding: 11px 4px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); border: 0.5px solid var(--border); text-align: center; }
  .quick-btn:active { background: var(--bg3); }

  .btn-primary { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm); background: var(--text); color: var(--bg); border: none; }
  .btn-primary:active { opacity: 0.75; }
  .btn-secondary { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: var(--radius-sm); background: transparent; color: var(--text); border: 0.5px solid var(--border2); margin-top: 8px; }
  .btn-secondary:active { background: var(--bg2); }
  .btn-del { background: none; border: none; cursor: pointer; color: var(--text3); padding: 6px 8px; border-radius: 6px; font-size: 17px; }
  .btn-del:active { color: #c0392b; }

  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .date-nav-label { font-size: 17px; font-weight: 600; }
  .date-nav-btn { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); font-size: 22px; }
  .date-nav-btn:active { background: var(--bg3); }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .metric { background: var(--bg2); border-radius: var(--radius-sm); padding: 14px; }
  .metric-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .metric-value { font-size: 26px; font-weight: 600; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .entry-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 0.5px solid var(--border); }
  .entry-item:last-child { border-bottom: none; }
  .entry-hours-big { font-size: 22px; font-weight: 600; }
  .entry-note { font-size: 13px; color: var(--text2); margin-top: 3px; }

  .toggle-group { display: flex; gap: 6px; margin-bottom: 14px; }
  .toggle-btn { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }
  .toggle-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }

  .bar-row { margin-bottom: 12px; }
  .bar-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 5px; }
  .bar-header span:last-child { font-weight: 600; color: var(--text); }
  .bar-bg { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--text); border-radius: 4px; transition: width 0.4s ease; }

  .empty { text-align: center; padding: 36px 16px; color: var(--text3); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .divider { height: 0.5px; background: var(--border); margin: 14px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Work Hours</div>
    <div class="header-sub" id="today-label"></div>
  </div>
  <div class="live-clock" id="live-clock"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('log')" id="tab-btn-log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Log
  </button>
  <button class="tab" onclick="switchTab('today')" id="tab-btn-today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Today
  </button>
  <button class="tab" onclick="switchTab('stats')" id="tab-btn-stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Stats
  </button>
  <button class="tab" onclick="switchTab('export')" id="tab-btn-export">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export
  </button>
</div>

<div class="content">

  <!-- LOG -->
  <div class="tab-panel active" id="panel-log">
    <div class="card">
      <div class="field-mb">
        <label class="field-label">Date</label>
        <input type="date" id="log-date">
      </div>
      <label class="field-label">Hours worked</label>
      <div class="hours-wrap">
        <input type="number" id="log-hours" placeholder="0" min="0.25" max="24" step="0.25" inputmode="decimal">
        <span class="hours-unit">hrs</span>
      </div>
      <label class="field-label" style="margin-bottom:8px;">Quick add</label>
      <div class="quick-btns">
        <button class="quick-btn" onclick="setH(4)">4h</button>
        <button class="quick-btn" onclick="setH(6)">6h</button>
        <button class="quick-btn" onclick="setH(8)">8h</button>
        <button class="quick-btn" onclick="setH(10)">10h</button>
      </div>
      <div class="field-mb">
        <label class="field-label">Note (optional)</label>
        <input type="text" id="log-note" placeholder="e.g. WFH, client site…">
      </div>
      <button class="btn-primary" onclick="addEntry()">+ Add Entry</button>
    </div>
  </div>

  <!-- TODAY -->
  <div class="tab-panel" id="panel-today">
    <div class="date-nav">
      <button class="date-nav-btn" onclick="changeDay(-1)">‹</button>
      <span class="date-nav-label" id="day-label"></span>
      <button class="date-nav-btn" onclick="changeDay(1)">›</button>
    </div>
    <div class="metric-grid" id="today-metrics"></div>
    <div class="card" id="today-entries"></div>
  </div>

  <!-- STATS -->
  <div class="tab-panel" id="panel-stats">
    <div class="toggle-group">
      <button class="toggle-btn active" onclick="setPeriod('week',this)">Week</button>
      <button class="toggle-btn" onclick="setPeriod('month',this)">Month</button>
      <button class="toggle-btn" onclick="setPeriod('year',this)">Year</button>
    </div>
    <div class="metric-grid" id="stats-metrics"></div>
    <div class="card" id="stats-chart"></div>
  </div>

  <!-- EXPORT -->
  <div class="tab-panel" id="panel-export">
    <div class="card">
      <div class="section-title">Quick select</div>
      <button class="btn-secondary" style="margin-top:0;margin-bottom:8px;" onclick="setPreset('week')">This week</button>
      <button class="btn-secondary" style="margin-top:0;margin-bottom:8px;" onclick="setPreset('month')">This month</button>
      <button class="btn-secondary" style="margin-top:0;" onclick="setPreset('all')">All time</button>
    </div>
    <div class="card">
      <div class="section-title">Custom range</div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <div style="flex:1"><label class="field-label">From</label><input type="date" id="exp-from"></div>
        <div style="flex:1"><label class="field-label">To</label><input type="date" id="exp-to"></div>
      </div>
      <div id="export-count" style="font-size:13px;color:var(--text2);min-height:20px;margin-bottom:4px;"></div>
      <button class="btn-primary" onclick="exportCSV()" style="margin-top:8px;">⬇ Download CSV</button>
    </div>
    <div class="card" style="font-size:13px;color:var(--text2);line-height:1.8;">
      CSV includes date, hours, and notes — open in Excel, Google Sheets, or Numbers.
      <div class="divider"></div>
      <strong style="color:var(--text);">Add to iPhone home screen:</strong><br>
      Open in Safari → Share button → "Add to Home Screen"
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'workhours_v3';
let entries = JSON.parse(localStorage.getItem(KEY) || '[]');
let viewDate = new Date();
let period = 'week';

function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function toDS(d) { return d.toISOString().split('T')[0]; }
function fmtDate(s) {
  const d = new Date(s + 'T12:00:00');
  const t = toDS(new Date()), y = toDS(new Date(Date.now()-86400000));
  if (s===t) return 'Today'; if (s===y) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtH(h) {
  if (!h||h<=0) return '0h';
  const hrs=Math.floor(h), mins=Math.round((h-hrs)*60);
  if (hrs===0) return mins+'m';
  return mins>0 ? hrs+'h '+mins+'m' : hrs+'h';
}
function setH(v) { document.getElementById('log-hours').value = v; }

function addEntry() {
  const date = document.getElementById('log-date').value;
  const hours = parseFloat(document.getElementById('log-hours').value);
  const note = document.getElementById('log-note').value.trim();
  if (!date) { toast('Please select a date'); return; }
  if (!hours||hours<=0) { toast('Please enter hours worked'); return; }
  if (hours>24) { toast("Hours can't exceed 24"); return; }
  entries.push({id:Date.now(), date, hours, note});
  save();
  document.getElementById('log-hours').value = '';
  document.getElementById('log-note').value = '';
  toast('Entry added ✓');
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e=>e.id!==id);
  save(); renderToday(); toast('Deleted');
}

function switchTab(t) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  document.getElementById('tab-btn-'+t).classList.add('active');
  if (t==='today') renderToday();
  if (t==='stats') renderStats();
  if (t==='export') renderExportPreview();
}

function changeDay(d) { viewDate=new Date(viewDate.getTime()+d*86400000); renderToday(); }

function renderToday() {
  const ds = toDS(viewDate);
  document.getElementById('day-label').textContent = fmtDate(ds);
  const day = entries.filter(e=>e.date===ds);
  const total = day.reduce((s,e)=>s+e.hours,0);
  document.getElementById('today-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Total hours</div><div class="metric-value">${fmtH(total)}</div></div>
    <div class="metric"><div class="metric-label">Entries</div><div class="metric-value">${day.length}</div></div>`;
  const el = document.getElementById('today-entries');
  if (!day.length) { el.innerHTML='<div class="empty"><div class="empty-icon">📋</div>No entries for this day</div>'; return; }
  el.innerHTML = [...day].sort((a,b)=>a.id-b.id).map(e=>`
    <div class="entry-item">
      <div>
        <div class="entry-hours-big">${fmtH(e.hours)}</div>
        ${e.note?'<div class="entry-note">'+e.note+'</div>':''}
      </div>
      <button class="btn-del" onclick="deleteEntry(${e.id})">🗑</button>
    </div>`).join('');
}

function setPeriod(p, btn) {
  period=p;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderStats();
}

function getRange(p) {
  const now=new Date(); let start;
  if (p==='week') { start=new Date(now); start.setDate(now.getDate()-now.getDay()); }
  else if (p==='month') { start=new Date(now.getFullYear(),now.getMonth(),1); }
  else { start=new Date(now.getFullYear(),0,1); }
  return {start:toDS(start), end:toDS(now)};
}

function renderStats() {
  const {start,end}=getRange(period);
  const f=entries.filter(e=>e.date>=start&&e.date<=end);
  const total=f.reduce((s,e)=>s+e.hours,0);
  const days=new Set(f.map(e=>e.date)).size;
  const avg=days>0?total/days:0;
  document.getElementById('stats-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total hours</div><div class="metric-value">${fmtH(total)}</div></div>
    <div class="metric"><div class="metric-label">Work days</div><div class="metric-value">${days}</div></div>
    <div class="metric"><div class="metric-label">Daily avg</div><div class="metric-value">${fmtH(avg)}</div></div>
    <div class="metric"><div class="metric-label">Entries</div><div class="metric-value">${f.length}</div></div>`;
  const grouped={};
  f.forEach(e=>{grouped[e.date]=(grouped[e.date]||0)+e.hours;});
  const dates=Object.keys(grouped).sort();
  const show=period==='week'?dates:dates.slice(-10);
  const chart=document.getElementById('stats-chart');
  if (!show.length) { chart.innerHTML='<div class="empty">No data for this period</div>'; return; }
  const maxH=Math.max(...show.map(d=>grouped[d]),1);
  chart.innerHTML='<div class="section-title">'+(period==='week'?'Daily breakdown':'Recent days')+'</div>'+
    show.map(d=>`<div class="bar-row">
      <div class="bar-header"><span>${fmtDate(d)}</span><span>${fmtH(grouped[d])}</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,(grouped[d]/maxH)*100).toFixed(1)}%"></div></div>
    </div>`).join('');
}

function setPreset(p) {
  const now=new Date(); let from;
  if (p==='week') { const s=new Date(now); s.setDate(now.getDate()-now.getDay()); from=toDS(s); }
  else if (p==='month') { from=toDS(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { const s=[...entries].sort((a,b)=>a.date.localeCompare(b.date)); from=s.length?s[0].date:toDS(now); }
  document.getElementById('exp-from').value=from;
  document.getElementById('exp-to').value=toDS(now);
  renderExportPreview();
}

function renderExportPreview() {
  const from=document.getElementById('exp-from').value, to=document.getElementById('exp-to').value;
  const el=document.getElementById('export-count');
  if (!from||!to) { el.textContent=''; return; }
  const f=entries.filter(e=>e.date>=from&&e.date<=to);
  const total=f.reduce((s,e)=>s+e.hours,0);
  el.textContent=f.length+' entr'+(f.length===1?'y':'ies')+' · '+fmtH(total)+' total';
}

function exportCSV() {
  const from=document.getElementById('exp-from').value, to=document.getElementById('exp-to').value;
  if (!from||!to) { toast('Select a date range'); return; }
  const f=entries.filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  if (!f.length) { toast('No entries in range'); return; }
  const rows=['Date,Hours,Note'];
  f.forEach(e=>rows.push([e.date,e.hours.toFixed(2),'"'+(e.note||'').replace(/"/g,'""')+'"'].join(',')));
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='work-hours-'+from+'-to-'+to+'.csv'; a.click();
  URL.revokeObjectURL(a.href); toast('Downloaded ✓');
}

function startClock() {
  function tick() {
    const n=new Date();
    document.getElementById('live-clock').textContent=
      String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
  }
  tick(); setInterval(tick,1000);
}

document.getElementById('log-date').value = toDS(new Date());
document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
document.getElementById('exp-from').addEventListener('change', renderExportPreview);
document.getElementById('exp-to').addEventListener('change', renderExportPreview);
setPreset('week');
startClock();
</script>
</body>
</html>
